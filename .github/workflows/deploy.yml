name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "scripts/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Copy sources to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p ~/logofier"
          tar --exclude=.git --exclude=.env --exclude=logofier.db -czf - . | \
            sshpass -e ssh -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" \
            "tar -xzf - -C ~/logofier"

      - name: Write .env from secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASS }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          PAYLOAD=$(python3 - <<'PY'
          import base64, os

          values = {
              "POSTGRES_USER": os.getenv("POSTGRES_USER", ""),
              "POSTGRES_PASSWORD": os.getenv("POSTGRES_PASSWORD", ""),
              "POSTGRES_DB": os.getenv("POSTGRES_DB", ""),
              "JWT_SECRET": os.getenv("JWT_SECRET", ""),
              "JWT_EXPIRATION_MINUTES": "60",
              "REFRESH_TOKEN_EXPIRATION_DAYS": "14",
              "CORS_ORIGINS": os.getenv("CORS_ORIGINS", ""),
              "R2_ACCOUNT_ID": os.getenv("R2_ACCOUNT_ID", ""),
              "R2_ACCESS_KEY_ID": os.getenv("R2_ACCESS_KEY_ID", ""),
              "R2_SECRET_ACCESS_KEY": os.getenv("R2_SECRET_ACCESS_KEY", ""),
              "R2_BUCKET_NAME": os.getenv("R2_BUCKET_NAME", ""),
              "R2_PUBLIC_URL": os.getenv("R2_PUBLIC_URL", ""),
          }
          content = "".join(f"{k}={v}\n" for k, v in values.items())
          print(base64.b64encode(content.encode()).decode())
          PY
          )
          sshpass -e ssh -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" \
            "echo '${PAYLOAD}' | base64 -d > ~/logofier/.env"

      - name: Rebuild and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" \
            "cd ~/logofier && docker compose up -d --build --pull always"