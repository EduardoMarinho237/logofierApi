name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logofier
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: logofier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logofier -d logofier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y libcairo2 libmupdf-dev

      - name: Run tests against Postgres
        env:
          TEST_DATABASE_URL: postgresql://logofier:ci-password@localhost:5432/logofier_test
          JWT_SECRET: ci-test-secret-change-me-1234567890abcdef
        run: pytest -q